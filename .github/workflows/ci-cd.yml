name: OENGO Web CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: npm run build

  build-and-push:
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OENGO Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        if: env.SSH_KEY != ''
        with:
          host: ${{ secrets.SERVER_HOST || '62.210.92.60' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "Deploying OENGO Web on VPS (62.210.92.60)..."
            if [ -d "/opt/oenexa/src/oengo-web" ]; then
              cd /opt/oenexa/src/oengo-web
              git fetch origin main
              git reset --hard origin/main
            fi
            cd /opt/oenexa
            if docker compose config --services | grep -qx "oengo-web"; then
              docker compose build oengo-web
              docker compose up -d --no-deps oengo-web
              docker compose ps oengo-web
            else
              echo "oengo-web service not enabled in /opt/oenexa/docker-compose.yml; source synced only."
            fi

      - name: Report missing SSH secret
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        if: env.SSH_KEY == ''
        run: echo "::warning::SERVER_SSH_KEY secret is not configured in this repository. Skipping automatic SSH deployment to VPS."
